<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rhymescape</title>
  <meta name="description" content="Drop your bars and see your rhyme scheme light up, chain by chain. No bars handy? Paste a verse you know.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='oklch(0.21 0.035 262)'/%3E%3Cpath d='M5 24C5 8 15 8 15 24' fill='none' stroke='oklch(0.7 0.21 354)' stroke-width='3.2' stroke-linecap='round'/%3E%3Cpath d='M13 24C13 3 28 3 28 24' fill='none' stroke='oklch(0.93 0.17 102)' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>document.documentElement.classList.add('js')</script>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <div class="app">
    <header class="top">
      <a class="dock" href="#top" aria-label="Rhymescape">
        <svg viewBox="0 0 28 20" width="28" height="20" aria-hidden="true"><path class="dock-arc a" d="M2 17C2 4 12 4 12 17"/><path class="dock-arc b" d="M10 17C10 -1 26 -1 26 17"/></svg>
        <span>Rhymescape</span>
      </a>
    </header>

    <main class="workspace" id="top" data-empty>
      <section class="left">
        <div class="intro" data-reveal>
          <h1>Write bars.<br><span>Watch every rhyme light up.</span></h1>
          <p class="lede">See your rhyme scheme, chain by chain.</p>
        </div>

        <section class="plate plate-pink write" data-reveal aria-label="Write">
          <div class="plate-core">
            <div class="plate-head">
              <label class="label" for="verse-input">Write</label>
              <span class="meta" id="input-meta">0 lines</span>
            </div>
            <textarea id="verse-input" class="field" spellcheck="false" autocomplete="off" placeholder="Drop your bars here. No bars? Paste a verse you know."></textarea>
            <div class="actions">
              <span class="hint"><kbd>Ctrl</kbd> <kbd>Enter</kbd></span>
              <button type="button" class="btn btn-primary" id="analyze-btn" disabled>
                <span id="analyze-label">Loading dictionary</span>
                <span class="btn-orb"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 4.5h7.5V12M11.5 4.5 4 12"/></svg></span>
              </button>
            </div>
          </div>
        </section>
      </section>

      <section class="plate plate-blue read" data-reveal aria-labelledby="read-h">
        <div class="plate-core">
          <div class="plate-head">
            <p class="label" id="read-h">Read view</p>
            <span class="meta" id="read-meta"></span>
            <button class="toggle" id="loose-toggle" type="button" aria-pressed="true" hidden>
              <span class="toggle-dot" aria-hidden="true"></span>Loose rhymes <b id="loose-count">0</b>
            </button>
          </div>

          <div class="rail-wrap" id="rail-wrap" hidden>
            <ul class="rail" id="chain-rail" aria-label="Rhyme chains"></ul>
            <p class="detail" id="chain-detail" data-state="idle" aria-live="polite"></p>
          </div>

          <div class="read-scroll" id="read-scroll">
            <div class="read-stage" id="read-stage">
              <div id="read-view" class="read-view" aria-live="polite">
                <div class="empty">
                  <p>Your rhyme scheme shows up here.</p>
                  <p class="empty-sub">Drop your bars, or paste a verse you know.</p>
                </div>
              </div>
              <svg class="arcs" id="arcs" aria-hidden="true" focusable="false"></svg>
            </div>
          </div>

        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
